<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" role="img"><title>Server and client ticks</title><desc>Packets between client and server ticks: a move and its reply split into six intervals, a move arriving mid-tick, and replies that don't wait for a tick.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#e8e6df;dominant-baseline:central}
.h{font-size:15px;font-weight:600}
.m{fill:#b4b2a9}
.c{text-anchor:middle}
.box{fill:#3a3936}
.brk{fill:none;stroke:#b4b2a9;stroke-width:1}
.pk{fill:none;stroke-width:1.75}
.wait{fill:none;stroke-width:1.75;stroke-dasharray:5 4}
.move{stroke:#afa9ec}.reply{stroke:#5dcaa5}.ping{stroke:#b4b2a9}
.dot-move{fill:#afa9ec}.dot-reply{fill:#5dcaa5}
</style>
<defs>
<marker id="a-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" class="move" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" class="reply" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-ping" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" class="ping" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="100%" height="100%" fill="#1f1e1d"/>
<text class="h" x="20" y="30">A move and its reply: one loop, six intervals</text>
<text class="m" x="20" y="108.0">server</text>
<text class="m" x="20" y="195.0">client</text>
<rect class="box" x="160" y="92" width="90" height="32"/>
<text class="c" x="205.0" y="108.0">tick N−1</text>
<rect class="box" x="410" y="92" width="90" height="32"/>
<text class="c" x="455.0" y="108.0">tick N</text>
<rect class="box" x="660" y="92" width="90" height="32"/>
<text class="c" x="705.0" y="108.0">tick N+1</text>
<rect class="box" x="110" y="184" width="30" height="22"/>
<rect class="box" x="360" y="184" width="30" height="22"/>
<rect class="box" x="610" y="184" width="30" height="22"/>
<line class="pk move" x1="140" y1="184" x2="280" y2="124" marker-end="url(#a-move)"/>
<line class="wait move" x1="280" y1="124" x2="410" y2="124" marker-end="url(#a-move)"/>
<line class="pk move" x1="500" y1="124" x2="560" y2="184" marker-end="url(#a-move)"/>
<line class="wait move" x1="560" y1="184" x2="610" y2="184" marker-end="url(#a-move)"/>
<text x="222.0" y="162.0">net up</text>
<text x="518.0" y="162.0" style="text-anchor:end">net down</text>
<path class="brk" d="M280 89V84H410V89"/>
<text class="c" x="345.0" y="75">server wait</text>
<path class="brk" d="M410 89V84H500V89"/>
<text class="c" x="455.0" y="75">server work</text>
<path class="brk" d="M110 211V216H140V211"/>
<text class="c" x="125.0" y="228">client work</text>
<path class="brk" d="M560 211V216H610V211"/>
<text class="c" x="585.0" y="228">client wait</text>
<text class="h" x="20" y="290">A move arriving mid-tick</text>
<text class="m" x="20" y="368.0">server</text>
<text class="m" x="20" y="455.0">client</text>
<rect class="box" x="160" y="352" width="90" height="32"/>
<text class="c" x="205.0" y="368.0">tick N−1</text>
<rect class="box" x="410" y="352" width="90" height="32"/>
<text class="c" x="455.0" y="368.0">tick N</text>
<rect class="box" x="660" y="352" width="90" height="32"/>
<text class="c" x="705.0" y="368.0">tick N+1</text>
<rect class="box" x="245" y="444" width="30" height="22"/>
<rect class="box" x="495" y="444" width="30" height="22"/>
<rect class="box" x="745" y="444" width="30" height="22"/>
<line class="pk move" x1="275" y1="444" x2="435" y2="384" marker-end="url(#a-move)"/>
<line class="wait move" x1="435" y1="384" x2="660" y2="384" marker-end="url(#a-move)"/>
<circle cx="500" cy="384" r="3" class="dot-move"/>
<path class="brk" d="M435 325V320H660V325"/>
<text class="c" x="547.5" y="311">server wait</text>
<path class="brk" d="M435 349V344H500V349"/>
<text class="c" x="467.5" y="335">queued</text>
<path class="brk" d="M500 349V344H660V349"/>
<text class="c" x="580.0" y="335">waits for tick N+1</text>
<text class="h" x="20" y="530">Replies sent without a tick: tab completion and the debug ping</text>
<text class="m" x="20" y="608.0">server</text>
<text class="m" x="20" y="695.0">client</text>
<rect class="box" x="160" y="592" width="90" height="32"/>
<text class="c" x="205.0" y="608.0">tick N−1</text>
<rect class="box" x="410" y="592" width="90" height="32"/>
<text class="c" x="455.0" y="608.0">tick N</text>
<rect class="box" x="660" y="592" width="90" height="32"/>
<text class="c" x="705.0" y="608.0">tick N+1</text>
<rect class="box" x="110" y="684" width="30" height="22"/>
<rect class="box" x="360" y="684" width="30" height="22"/>
<rect class="box" x="610" y="684" width="30" height="22"/>
<line class="pk reply" x1="150" y1="684" x2="270" y2="624" marker-end="url(#a-reply)"/>
<line class="pk reply" x1="270" y1="624" x2="330" y2="684" marker-end="url(#a-reply)"/>
<text class="c" x="270" y="575">idle: answered at once</text>
<line class="pk reply" x1="340" y1="684" x2="460" y2="624" marker-end="url(#a-reply)"/>
<line class="wait reply" x1="460" y1="624" x2="500" y2="624" marker-end="url(#a-reply)"/>
<line class="pk reply" x1="500" y1="624" x2="560" y2="684" marker-end="url(#a-reply)"/>
<path class="brk" d="M460 589V584H500V589"/>
<text class="c" x="480.0" y="575">busy: waits for the tick's end</text>
<line class="pk ping" x1="570" y1="684" x2="690" y2="624" marker-end="url(#a-ping)"/>
<line class="pk ping" x1="690" y1="624" x2="750" y2="684" marker-end="url(#a-ping)"/>
<text class="c" x="690" y="575">network thread: at once</text>
<line class="pk move" x1="20" y1="750" x2="60" y2="750"/>
<text x="72" y="750">read by a tick; its reply leaves when that tick ends: move, sprint toggle</text>
<line class="pk reply" x1="20" y1="772" x2="60" y2="772"/>
<text x="72" y="772">answered by its handler between ticks: tab completion, chat command</text>
<line class="pk ping" x1="20" y1="794" x2="60" y2="794"/>
<text x="72" y="794">answered on the network thread, even mid-tick: debug ping</text>
<line class="wait ping" x1="20" y1="816" x2="60" y2="816"/>
<text x="72" y="816">dashes: waiting in a queue</text>
</svg>

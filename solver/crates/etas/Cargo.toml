[package]
name = "etas"
version.workspace = true
edition.workspace = true

[[bin]]
name = "etas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
itertools = "0.15.0"
port = { version = "0.1.0", path = "../port" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: artifacts carry exact doubles as JSON numbers, and the default
# parser can be off by an ulp
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
sim = { version = "0.1.0", path = "../sim" }
world = { version = "0.1.0", path = "../world" }
